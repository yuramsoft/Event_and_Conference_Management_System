{% extends "organizer/base.html" %}
{% block title %}Delete{% endblock %}
{% block page_title %}Delete {{ object }}?{% endblock %}
{% block dash %}
<div class="card border-0 shadow-sm" style="max-width:560px"><div class="card-body p-4">
  <p>This permanently deletes <strong>{{ object }}</strong>. This can't be undone.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger"><i class="bi bi-trash me-1"></i>Delete</button>
    <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div></div>
{% endblock %}
