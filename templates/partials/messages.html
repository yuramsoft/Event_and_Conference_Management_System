{% if messages %}
<div class="eh-toasts position-fixed top-0 end-0 p-3" style="z-index:1080">
  {% for message in messages %}
  <div class="toast align-items-center border-0 show text-bg-{% if message.tags == 'error' %}danger{% elif message.tags %}{{ message.tags }}{% else %}secondary{% endif %}" role="alert" aria-live="assertive" data-bs-delay="6000">
    <div class="d-flex">
      <div class="toast-body">{{ message }}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}
